apiVersion: 1

datasources:
  - name: WISPnet-OpenSearch
    type: opensearch
    access: proxy
    url: http://opensearch:9200
    isDefault: true
    jsonData:
      version: "2.11.0"
      database: "wisp-security-events-*"
      timeField: "event_timestamp"
      interval: "1m"
      tlsAuth: false
      tlsAuthWithCACert: false
      tlsSkipVerify: true
    editable: true

  - name: WISPnet-API
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: http://synchavxxx-app:8000
    jsonData:
      authType: "none"
    editable: true
